name: Fix constat UI

on:
  push:
    paths:
      - '.github/workflows/fix-constat-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_constat.py
      - name: Commit patched source
        run: |
          if git diff --quiet -- src/main.jsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx
          git commit -m "fix: generate and display billing statement"
          git push
