name: Wire daily pilotage overlay

on:
  push:
    branches: [main]
    paths:
      - 'src/dailyPilotageOverlay.js'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add daily pilotage import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main.jsx')
          s = p.read_text()
          marker = 'import "./dailyPilotageOverlay";'
          if marker not in s:
              s = marker + '\n' + s
              p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.jsx
          git diff --cached --quiet || git commit -m 'ci: wire daily pilotage overlay into app'
          git push
