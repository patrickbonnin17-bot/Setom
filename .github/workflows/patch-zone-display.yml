name: Patch OS zone display
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-zone-display.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch main.jsx
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.jsx')
          s = p.read_text(encoding='utf-8')

          if 'rehabilitationOtherDetail: row.rehabilitation_other_detail' not in s:
              old = '        rehabilitationZone: row.rehabilitation_zone,\n'
              new = old + '        rehabilitationOtherDetail: row.rehabilitation_other_detail,\n'
              if old not in s:
                  raise SystemExit('load mapping marker not found')
              s = s.replace(old, new, 1)

          if 'rehabilitationOtherDetail: data.rehabilitation_other_detail' not in s:
              old = '    rehabilitationZone: data.rehabilitation_zone,\n'
              new = old + '    rehabilitationOtherDetail: data.rehabilitation_other_detail,\n'
              if old not in s:
                  raise SystemExit('formatted mapping marker not found')
              s = s.replace(old, new, 1)

          if '<span>Zone de réfection</span>' not in s:
              marker = '          <div className="os-detail-badge">\n            <span>Statut</span>'
              block = '''          <div className="os-detail-badge">
            <span>Zone de réfection</span>
            <strong>{os.rehabilitationZone || "—"}</strong>
          </div>

          {os.rehabilitationZone === "Autre" && os.rehabilitationOtherDetail && (
            <div className="os-detail-badge">
              <span>Précision</span>
              <strong>{os.rehabilitationOtherDetail}</strong>
            </div>
          )}

          {os.rehabilitationZone === "Chaussée + trottoir" && (
            <>
              <div className="os-detail-badge">
                <span>Chaussée</span>
                <strong>{os.roadSurface != null ? `${os.roadSurface} m²` : "—"}</strong>
              </div>
              <div className="os-detail-badge">
                <span>Trottoir</span>
                <strong>{os.sidewalkSurface != null ? `${os.sidewalkSurface} m²` : "—"}</strong>
              </div>
            </>
          )}

          {os.rehabilitationZone === "Chaussée" && (
            <div className="os-detail-badge">
              <span>Surface chaussée</span>
              <strong>{os.roadSurface != null ? `${os.roadSurface} m²` : "—"}</strong>
            </div>
          )}

          {os.rehabilitationZone === "Trottoir" && (
            <div className="os-detail-badge">
              <span>Surface trottoir</span>
              <strong>{os.sidewalkSurface != null ? `${os.sidewalkSurface} m²` : "—"}</strong>
            </div>
          )}

          <div className="os-detail-badge">
            <span>Statut</span>'''
              if marker not in s:
                  raise SystemExit('summary marker not found')
              s = s.replace(marker, block, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx
          git diff --cached --quiet || git commit -m "Display rehabilitation zone in OS summary"
          git push
