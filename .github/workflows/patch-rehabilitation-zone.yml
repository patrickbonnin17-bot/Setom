name: Patch rehabilitation zone

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[zone-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch application
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/main.jsx')
          s = p.read_text()

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'{label} anchor not found')
              s = s.replace(old, new, 1)

          replace_once(
              '''const [newOSMaterialDetail, setNewOSMaterialDetail] = useState("");\nconst [newOSSurface, setNewOSSurface] = useState("");''',
              '''const [newOSMaterialDetail, setNewOSMaterialDetail] = useState("");\nconst [newOSSurface, setNewOSSurface] = useState("");\nconst [newOSRehabilitationZone, setNewOSRehabilitationZone] = useState("");\nconst [newOSRehabilitationOtherDetail, setNewOSRehabilitationOtherDetail] = useState("");\nconst [newOSRoadSurface, setNewOSRoadSurface] = useState("");\nconst [newOSSidewalkSurface, setNewOSSidewalkSurface] = useState("");''',
              'state')

          replace_once(
              '''  const surface =\n    newOSSurface.trim() === ""\n      ? null\n      : Number(newOSSurface.replace(",", "."));\n\n  if (newOSSurface.trim() !== "" && isNaN(surface)) {\n    setNewOSError("La surface doit être un nombre.");\n    setNewOSSaving(false);\n    return;\n  }''',
              '''  const parseSurface = (value) =>\n    value.trim() === "" ? null : Number(value.replace(",", "."));\n\n  const genericSurface = parseSurface(newOSSurface);\n  const roadSurface = parseSurface(newOSRoadSurface);\n  const sidewalkSurface = parseSurface(newOSSidewalkSurface);\n\n  if ([genericSurface, roadSurface, sidewalkSurface].some((value) => value !== null && isNaN(value))) {\n    setNewOSError("Les surfaces doivent être des nombres.");\n    setNewOSSaving(false);\n    return;\n  }\n\n  if (!newOSRehabilitationZone) {\n    setNewOSError("Veuillez sélectionner la zone de réfection.");\n    setNewOSSaving(false);\n    return;\n  }\n\n  if (newOSRehabilitationZone === "Autre" && !newOSRehabilitationOtherDetail.trim()) {\n    setNewOSError("Veuillez préciser la zone de réfection.");\n    setNewOSSaving(false);\n    return;\n  }\n\n  const surface =\n    newOSRehabilitationZone === "Chaussée"\n      ? roadSurface\n      : newOSRehabilitationZone === "Trottoir"\n        ? sidewalkSurface\n        : newOSRehabilitationZone === "Chaussée + trottoir"\n          ? (roadSurface || 0) + (sidewalkSurface || 0)\n          : genericSurface;''',
              'surface logic')

          replace_once(
              '''      material_detail:\n        newOSMaterialDetail.trim() || newOSMaterial,\n      planned_surface_m2: surface,''',
              '''      material_detail:\n        newOSMaterialDetail.trim() || newOSMaterial,\n      rehabilitation_zone: newOSRehabilitationZone,\n      rehabilitation_other_detail:\n        newOSRehabilitationOtherDetail.trim() || null,\n      planned_road_surface_m2: roadSurface,\n      planned_sidewalk_surface_m2: sidewalkSurface,\n      planned_surface_m2: surface,''',
              'insert')

          replace_once(
              '''  setNewOSMaterialDetail("");\n  setNewOSSurface("");\n  setNewOSParticularities("");''',
              '''  setNewOSMaterialDetail("");\n  setNewOSSurface("");\n  setNewOSRehabilitationZone("");\n  setNewOSRehabilitationOtherDetail("");\n  setNewOSRoadSurface("");\n  setNewOSSidewalkSurface("");\n  setNewOSParticularities("");''',
              'reset')

          replace_once(
              '''        intervention: row.material_detail || "Intervention",\n        deadline: row.deadline_date,''',
              '''        intervention: row.material_detail || "Intervention",\n        rehabilitationZone: row.rehabilitation_zone,\n        roadSurface: row.planned_road_surface_m2,\n        sidewalkSurface: row.planned_sidewalk_surface_m2,\n        deadline: row.deadline_date,''',
              'load')

          replace_once(
              '''    intervention: data.material_detail || "Intervention",\n\n    deadline: data.deadline_date,''',
              '''    intervention: data.material_detail || "Intervention",\n\n    rehabilitationZone: data.rehabilitation_zone,\n    roadSurface: data.planned_road_surface_m2,\n    sidewalkSurface: data.planned_sidewalk_surface_m2,\n\n    deadline: data.deadline_date,''',
              'formatted')

          pattern = re.compile(r'(?P<indent>\s*)<label>[^<]*Surface[^<]*</label>\s*<input\s+type="number"\s+step="0\.01"\s+min="0"\s+value=\{newOSSurface\}\s+onChange=\{\(e\) => setNewOSSurface\(e\.target\.value\)\}\s+placeholder="Ex\. 12\.5"\s*/>', re.S)
          replacement = '''\g<indent><div className="rehabilitation-section">\n\g<indent>  <label>Zone de réfection *</label>\n\g<indent>  <div className="rehabilitation-cards">\n\g<indent>    {["Chaussée", "Trottoir", "Chaussée + trottoir", "Autre"].map((zone) => (\n\g<indent>      <button\n\g<indent>        key={zone}\n\g<indent>        type="button"\n\g<indent>        className={`rehabilitation-card ${newOSRehabilitationZone === zone ? "selected" : ""}`}\n\g<indent>        onClick={() => {\n\g<indent>          setNewOSRehabilitationZone(zone);\n\g<indent>          if (zone !== "Autre") setNewOSRehabilitationOtherDetail("");\n\g<indent>          if (zone === "Chaussée") setNewOSSidewalkSurface("");\n\g<indent>          if (zone === "Trottoir") setNewOSRoadSurface("");\n\g<indent>        }}\n\g<indent>      >\n\g<indent>        {zone}\n\g<indent>      </button>\n\g<indent>    ))}\n\g<indent>  </div>\n\n\g<indent>  {newOSRehabilitationZone === "Chaussée" && (\n\g<indent>    <div className="rehabilitation-surface-field">\n\g<indent>      <label>Surface chaussée prévue (m²)</label>\n\g<indent>      <input type="number" step="0.01" min="0" value={newOSRoadSurface} onChange={(e) => setNewOSRoadSurface(e.target.value)} placeholder="Ex. 12.5" />\n\g<indent>    </div>\n\g<indent>  )}\n\n\g<indent>  {newOSRehabilitationZone === "Trottoir" && (\n\g<indent>    <div className="rehabilitation-surface-field">\n\g<indent>      <label>Surface trottoir prévue (m²)</label>\n\g<indent>      <input type="number" step="0.01" min="0" value={newOSSidewalkSurface} onChange={(e) => setNewOSSidewalkSurface(e.target.value)} placeholder="Ex. 8.5" />\n\g<indent>    </div>\n\g<indent>  )}\n\n\g<indent>  {newOSRehabilitationZone === "Chaussée + trottoir" && (\n\g<indent>    <div className="rehabilitation-surface-grid">\n\g<indent>      <div>\n\g<indent>        <label>Surface chaussée (m²)</label>\n\g<indent>        <input type="number" step="0.01" min="0" value={newOSRoadSurface} onChange={(e) => setNewOSRoadSurface(e.target.value)} placeholder="Ex. 12.5" />\n\g<indent>      </div>\n\g<indent>      <div>\n\g<indent>        <label>Surface trottoir (m²)</label>\n\g<indent>        <input type="number" step="0.01" min="0" value={newOSSidewalkSurface} onChange={(e) => setNewOSSidewalkSurface(e.target.value)} placeholder="Ex. 6.5" />\n\g<indent>      </div>\n\g<indent>    </div>\n\g<indent>  )}\n\n\g<indent>  {newOSRehabilitationZone === "Autre" && (\n\g<indent>    <>\n\g<indent>      <label>Précision</label>\n\g<indent>      <input type="text" value={newOSRehabilitationOtherDetail} onChange={(e) => setNewOSRehabilitationOtherDetail(e.target.value)} placeholder="Préciser la zone de réfection" />\n\g<indent>      <label>Surface prévue (m²)</label>\n\g<indent>      <input type="number" step="0.01" min="0" value={newOSSurface} onChange={(e) => setNewOSSurface(e.target.value)} placeholder="Ex. 12.5" />\n\g<indent>    </>\n\g<indent>  )}\n\g<indent></div>'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('surface JSX anchor not found')
          p.write_text(s)

          css = Path('src/style.css')
          c = css.read_text()
          marker = '\n/* Rehabilitation zone */\n'
          if marker not in c:
              c += marker + '''.rehabilitation-section { margin-top: 16px; padding: 14px; border: 1px solid #e2e8f0; border-radius: 14px; background: #f8fafc; }\n.rehabilitation-section > label { display: block; font-weight: 700; margin-bottom: 8px; }\n.rehabilitation-cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }\n.rehabilitation-card { padding: 12px; border: 1px solid #d7dee8; border-radius: 10px; background: white; cursor: pointer; font-weight: 600; }\n.rehabilitation-card.selected { border-color: #1976d2; background: #eaf3ff; color: #145ea8; }\n.rehabilitation-surface-field { margin-top: 10px; }\n.rehabilitation-surface-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }\n@media (max-width: 600px) { .rehabilitation-cards, .rehabilitation-surface-grid { grid-template-columns: 1fr; } }\n'''
              css.write_text(c)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx src/style.css
          git diff --cached --quiet && exit 0
          git commit -m "feat: add rehabilitation zone to OS [zone-patch]"
          git push
