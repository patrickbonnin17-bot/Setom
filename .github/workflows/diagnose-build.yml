name: Diagnose and fix Vite build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Locate syntax error
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('src/main.jsx').read_text()
          pos = 58844
          line = s.count('\n', 0, pos) + 1
          col = pos - s.rfind('\n', 0, pos)
          print(f'Position {pos}: line {line}, column {col}')
          print('BEFORE:', repr(s[max(0,pos-120):pos]))
          print('AT:', repr(s[pos:pos+120]))
          print('LINE:', repr(s.splitlines()[line-1]))
          PY

      - run: npm run build
