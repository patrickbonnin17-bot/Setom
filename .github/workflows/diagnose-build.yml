name: Diagnose and fix Vite build

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Parse JSX with Babel
        shell: bash
        run: |
          npm install --no-save @babel/parser
          node - <<'NODE'
          const fs = require('fs');
          const parser = require('@babel/parser');
          const src = fs.readFileSync('src/main.jsx', 'utf8');
          try {
            parser.parse(src, {sourceType:'module', plugins:['jsx']});
            console.log('Babel parse OK');
          } catch (e) {
            console.log('BABEL ERROR:', e.message);
            console.log('POS:', e.pos, 'LOC:', e.loc);
            console.log(src.slice(Math.max(0,e.pos-300), e.pos+300));
            process.exit(1);
          }
          NODE
      - run: npm run build
