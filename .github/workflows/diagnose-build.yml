name: Diagnose and fix Vite build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch JSX if needed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main.jsx')
          s = p.read_text()
          old = '''      </div>\n\n      <div className="work-result">'''
          new = '''      </div>\n      )}\n\n      <div className="work-result">'''
          if old in s and new not in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
              print('Patched missing JSX closing fragment.')
          else:
              print('No JSX patch required.')
          PY

      - name: Commit JSX fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx
          git commit -m "Fix JSX wrapper in work form"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run build
