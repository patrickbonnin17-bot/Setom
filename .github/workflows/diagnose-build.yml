name: Build SETOM

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply final work-form fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main.jsx')
          s = p.read_text()

          # Fix the malformed JSX value attribute if still present.
          s = s.replace(').toFixed(2)}"\n            readOnly', ').toFixed(2)}\n            readOnly', 1)

          # Restore actual surface values when reopening an OS.
          marker = 'const [workComment, setWorkComment] = useState("");'
          init = '''const [workComment, setWorkComment] = useState("");

  useEffect(() => {
    setRealRoadSurface(os?.actualRoadSurface != null ? String(os.actualRoadSurface) : "");
    setRealSidewalkSurface(os?.actualSidewalkSurface != null ? String(os.actualSidewalkSurface) : "");
    setRealOtherSurface(os?.actualOtherSurface != null ? String(os.actualOtherSurface) : "");
  }, [os?.dbId, os?.actualRoadSurface, os?.actualSidewalkSurface, os?.actualOtherSurface]);'''
          if marker in s and 'setRealRoadSurface(os?.actualRoadSurface' not in s:
              s = s.replace(marker, init, 1)

          # Generate the draft billing statement automatically after work is saved.
          marker2 = '    alert("✅ Travaux réalisés enregistrés.");'
          billing = '''    const { error: constatError } = await supabase.rpc(
      "generate_constat_for_work_order",
      { p_work_order_id: os.dbId }
    );

    if (constatError) {
      console.error("Erreur génération constat :", constatError);
      alert("✅ Travaux enregistrés.\n\n⚠️ Le constat de facturation n'a pas pu être généré automatiquement : " + constatError.message);
    } else {
      alert("✅ Travaux réalisés enregistrés.\n\n💶 Le constat de facturation a été généré automatiquement et reste modifiable jusqu'à validation par Eau de Toulouse.");
    }'''
          if marker2 in s and 'generate_constat_for_work_order' not in s:
              s = s.replace(marker2, billing, 1)

          p.write_text(s)
          print('Final work-form fixes applied.')
          PY

      - name: Commit final fixes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx
          git commit -m "Complete work save and automatic billing draft"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Validate JSX
        shell: bash
        run: |
          npm install --no-save @babel/parser
          node - <<'NODE'
          const fs = require('fs');
          const parser = require('@babel/parser');
          parser.parse(fs.readFileSync('src/main.jsx', 'utf8'), {sourceType:'module', plugins:['jsx']});
          console.log('Babel parse OK');
          NODE
      - run: npm run build
