name: Patch OS zone display
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch main.jsx
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/main.jsx')
          s = p.read_text(encoding='utf-8')

          s, n1 = re.subn(r'(rehabilitationZone:\s*row\.rehabilitation_zone,\s*)', r'\1        rehabilitationOtherDetail: row.rehabilitation_other_detail,\n', s, count=1)
          s, n2 = re.subn(r'(rehabilitationZone:\s*data\.rehabilitation_zone,\s*)', r'\1    rehabilitationOtherDetail: data.rehabilitation_other_detail,\n', s, count=1)

          if 'Zone de réfection</span>' not in s:
              marker = '          <div className="os-detail-summary">'
              if marker not in s:
                  raise SystemExit('OS summary marker not found')
              block = '''          <div className="os-detail-summary">\n\n          <div className="os-detail-badge">\n            <span>Zone de réfection</span>\n            <strong>{os.rehabilitationZone || "—"}</strong>\n          </div>\n\n          {os.rehabilitationZone === "Autre" && os.rehabilitationOtherDetail && (\n            <div className="os-detail-badge">\n              <span>Précision</span>\n              <strong>{os.rehabilitationOtherDetail}</strong>\n            </div>\n          )}\n\n          {os.rehabilitationZone === "Chaussée + trottoir" && (\n            <>\n              <div className="os-detail-badge">\n                <span>Chaussée</span>\n                <strong>{os.roadSurface != null ? `${os.roadSurface} m²` : "—"}</strong>\n              </div>\n              <div className="os-detail-badge">\n                <span>Trottoir</span>\n                <strong>{os.sidewalkSurface != null ? `${os.sidewalkSurface} m²` : "—"}</strong>\n              </div>\n            </>\n          )}\n\n          {os.rehabilitationZone === "Chaussée" && (\n            <div className="os-detail-badge">\n              <span>Surface chaussée</span>\n              <strong>{os.roadSurface != null ? `${os.roadSurface} m²` : "—"}</strong>\n            </div>\n          )}\n\n          {os.rehabilitationZone === "Trottoir" && (\n            <div className="os-detail-badge">\n              <span>Surface trottoir</span>\n              <strong>{os.sidewalkSurface != null ? `${os.sidewalkSurface} m²` : "—"}</strong>\n            </div>\n          )}\n'''
              s = s.replace(marker, block, 1)

          if n1 != 1 or n2 != 1:
              raise SystemExit(f'field mapping incomplete: {n1}, {n2}')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx
          git diff --cached --quiet || (git commit -m "Display rehabilitation zone in OS summary" && git push)
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/patch-os-zone-display.yml || true
          git diff --cached --quiet || (git commit -m "Remove temporary patch workflow" && git push)
