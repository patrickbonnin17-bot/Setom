name: Patch surfaces longueur largeur

on:
  push:
    paths:
      - '.github/workflows/patch-surface-longueur-largeur.yml'
      - 'scripts/patch_surface_dimensions.py'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/patch_surface_dimensions.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx
          git diff --cached --quiet || (git commit -m "feat: calculate real surfaces from length and width by zone" && git push)
