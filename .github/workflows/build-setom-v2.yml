name: Build SETOM v2

on:
  push:
    branches:
      - setom-v2-stable
  pull_request:
    branches:
      - setom-v2-stable
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upgrade npm
        run: npm install --global npm@11
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
