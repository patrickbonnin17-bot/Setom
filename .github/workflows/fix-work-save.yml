name: Fix work save

on:
  push:
    paths:
      - '.github/workflows/fix-work-save.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch main.jsx
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.jsx')
          s = p.read_text(encoding='utf-8')

          marker = 'const [workComment, setWorkComment] = useState("");'
          insert = '''const [workComment, setWorkComment] = useState("");

 useEffect(() => {
  setRealRoadSurface(os?.actualRoadSurface != null ? String(os.actualRoadSurface) : "");
  setRealSidewalkSurface(os?.actualSidewalkSurface != null ? String(os.actualSidewalkSurface) : "");
  setRealOtherSurface(os?.actualOtherSurface != null ? String(os.actualOtherSurface) : "");
 }, [os?.dbId, os?.actualRoadSurface, os?.actualSidewalkSurface, os?.actualOtherSurface]);'''
          if marker in s and 'setRealRoadSurface(os?.actualRoadSurface' not in s:
              s = s.replace(marker, insert, 1)

          marker2 = '''    // 6. Mettre également l'affichage de l'application à jour
    onUpdate(os.id, {'''
          insert2 = '''    // 6. Générer automatiquement le constat de facturation en brouillon.
    // Le constat reste modifiable jusqu'à la validation par Eau de Toulouse.
    const { error: constatError } = await supabase.rpc(
      "generate_constat_for_work_order",
      {
        p_work_order_id: os.dbId,
        p_user_id: user.id,
      }
    );

    if (constatError) {
      console.error("Erreur génération constat :", constatError);
      alert(
        "⚠️ Les travaux sont enregistrés, mais le constat de facturation n'a pas pu être généré.\\n\\n" +
        constatError.message
      );
    }

    // 7. Mettre également l'affichage de l'application à jour
    onUpdate(os.id, {'''
          if marker2 in s and 'p_work_order_id: os.dbId' not in s:
              s = s.replace(marker2, insert2, 1)

          old_alert = '    alert("✅ Travaux réalisés enregistrés.");'
          new_alert = '''    if (!constatError) {
      alert("✅ Travaux réalisés enregistrés et constat de facturation généré.");
    }'''
          if old_alert in s:
              s = s.replace(old_alert, new_alert, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet -- src/main.jsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx
          git commit -m "fix: generate constat after completed work"
          git push