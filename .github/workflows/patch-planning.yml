name: Patch planning workflow

on:
  push:
    paths:
      - '.github/workflows/patch-planning.yml'
      - 'scripts/patch_planning.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply planning patch
        run: python scripts/patch_planning.py
      - name: Build application
        run: |
          npm ci
          npm run build
      - name: Commit patched source
        run: |
          if git diff --quiet -- src/main.jsx; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx
          git commit -m "feat: persist OS planning and align statuses"
          git push
