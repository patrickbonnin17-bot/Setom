name: Validate SETOM build

on:
  push:
    branches:
      - feature-target-ui-v2
      - next-finance-controls
  pull_request:
    branches:
      - main
      - next-finance-controls
      - feature-target-ui-v2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate workflow guards
        run: python3 scripts/patch_workflow_status.py

      - name: Build production bundle
        run: npm run build
