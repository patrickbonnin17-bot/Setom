name: Validate SETOM build

on:
  push:
    branches:
      - feature-target-ui-v2
      - next-finance-controls
  pull_request:
    branches:
      - main
      - next-finance-controls
      - feature-target-ui-v2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Use npm 11 for reliable dependency resolution
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate workflow guards
        run: python3 scripts/patch_workflow_status.py

      - name: Audit build chain
        run: python3 scripts/audit_build_chain.py

      - name: Build production bundle
        run: npm run build
