name: Normalize SETOM OS statuses

on:
  push:
    branches: [setom-v2-stable]
    paths:
      - 'tmp/status-workflow-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, '[auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: setom-v2-stable
      - name: Clean legacy status references
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/main.jsx')
          s=p.read_text()
          reps={
            '["Nouveau OS", "Planifié", "Travaux en cours", "En erreur"]':'["Nouveau OS", "Planifié", "En erreur"]',
            '["Nouveau OS", "Planifié", "Travaux en cours", "Travaux réalisés"]':'["Nouveau OS", "Planifié", "Travaux réalisés"]',
            'os.status==="Travaux effectués"':'os.status==="Validé"',
            'os.status === "Travaux effectués"':'os.status === "Validé"',
            'os.status==="Correction à réaliser"':'os.status==="Réserve"',
            'os.status === "Correction à réaliser"':'os.status === "Réserve"',
            '"Réserve à lever"':'"Réserve"',
            '"Travaux effectués"':'"Validé"',
            '"Constat validé"':'"Validé"',
            '"OS non planifiés"':'"Nouveaux OS"',
            '"dans la file À planifier"':'"dans la file Nouveaux OS"',
            '{os.status||"Nouveau"}':'{os.status||"Nouveau OS"}',
            '["Nouveau OS","Planifié","Travaux en cours","En erreur"]':'["Nouveau OS","Planifié","En erreur"]',
            '["Nouveau OS", "Planifié", "Travaux en cours", "En erreur"]':'["Nouveau OS", "Planifié", "En erreur"]',
            '["Nouveau OS", "Planifié", "Travaux en cours", "Travaux réalisés"]':'["Nouveau OS", "Planifié", "Travaux réalisés"]',
            '["Nouveau OS", "Planifié", "Travaux en cours", "En erreur"]':'["Nouveau OS", "Planifié", "En erreur"]',
            '["Nouveau OS", "Planifié", "Travaux en cours", "En erreur"]':'["Nouveau OS", "Planifié", "En erreur"]',
          }
          for a,b in reps.items(): s=s.replace(a,b)
          s=s.replace('const canEditWork = ["admin","bureau","equipe_terrain"].includes(profile?.role) && ["Nouveau OS","Planifié","En travaux","Travaux en cours","Travaux réalisés"].includes(os?.status);','const canEditWork = ["admin","bureau","equipe_terrain"].includes(profile?.role) && ["Nouveau OS","Planifié","Travaux réalisés"].includes(os?.status);')
          s=s.replace('const displayStatus = os.constatStatus === "Validé avec réserve" && !os.reserveResolvedAt ? "Réserve" : os.status;','const displayStatus = os.constatStatus === "Validé avec réserve" && !os.reserveResolvedAt ? "Réserve" : os.status;')
          p.write_text(s)
          PY
      - name: Build
        run: npm install && npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx src/statusColors.js
          git diff --cached --quiet && exit 0
          git commit -m "[auto] remove remaining legacy status labels"
          git push origin setom-v2-stable
