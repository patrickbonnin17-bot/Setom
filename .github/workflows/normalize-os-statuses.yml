name: Normalize SETOM OS statuses

on:
  push:
    branches: [setom-v2-stable]
    paths:
      - 'tmp/status-workflow-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, '[auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: setom-v2-stable
      - name: Patch frontend status vocabulary
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main.jsx')
          s = p.read_text()
          replacements = [
            ('const statuses = [\n  "Nouveau", "À planifier", "Planifié", "En travaux", "Travaux en cours", "Travaux réalisés",\n  "Constat à vérifier", "Travaux effectués", "Constat de facturation", "En attente de validation",\n  "Validé", "Validé avec réserve", "Réserve", "Correction à réaliser", "Payé", "Archivé", "En erreur", "Doublon", "Annulé",\n];',
             'const statuses = [\n  "Nouveau OS", "Planifié", "Travaux réalisés", "À vérifier", "Validé", "Réserve", "Payé", "Archivé", "En erreur", "Doublon", "Annulé",\n];'),
            ('const activeStatuses = new Set(["Nouveau", "À planifier", "Planifié", "En travaux", "Travaux en cours", "En erreur", "Travaux réalisés", "Constat à vérifier", "Constat validé", "Travaux effectués", "Constat de facturation", "En attente de validation", "Validé", "Validé avec réserve", "Réserve", "Correction à réaliser", "Payé"]);',
             'const activeStatuses = new Set(["Nouveau OS", "Planifié", "Travaux réalisés", "À vérifier", "Validé", "Réserve", "Payé"]);'),
            ('planning: osList.filter((o) => o.status === "À planifier").length,', 'planning: osList.filter((o) => o.status === "Nouveau OS").length,'),
            ('travaux: osList.filter((o) => o.status === "En travaux" || o.status === "Travaux en cours" || o.status === "Travaux réalisés").length,', 'travaux: osList.filter((o) => o.status === "Travaux réalisés").length,'),
            ('facturation: osList.filter((o) => (o.status === "Travaux effectués" || o.status === "Constat de facturation") && !(o.constatStatus === "Validé avec réserve" && !o.reserveResolvedAt)).length,', 'facturation: osList.filter((o) => o.status === "Validé" && !(o.constatStatus === "Validé avec réserve" && !o.reserveResolvedAt)).length,'),
            ('validation: osList.filter((o) => o.status === "En attente de validation" || o.status === "Constat à vérifier" || o.status === "Constat validé").length,', 'validation: osList.filter((o) => o.status === "À vérifier").length,'),
            ('reserves: osList.filter((o) => o.status === "Réserve" || o.status === "Correction à réaliser" || (o.constatStatus === "Validé avec réserve" && !o.reserveResolvedAt)).length,', 'reserves: osList.filter((o) => o.status === "Réserve" || (o.constatStatus === "Validé avec réserve" && !o.reserveResolvedAt)).length,'),
            ('if(["À planifier","Nouveau"].includes(os?.status)){', 'if(os?.status === "Nouveau OS"){'),
            ('if(["Constat à vérifier","Constat validé","Travaux effectués","Payé","Archivé"].includes(os?.status)){', 'if(["À vérifier","Validé","Payé","Archivé"].includes(os?.status)){'),
            ('if(!["Planifié","En travaux","Travaux en cours","Travaux réalisés"].includes(os?.status)){', 'if(os?.status !== "Planifié" && os?.status !== "Travaux réalisés"){'),
            ('status:"Travaux en cours",planned_surface_m2:', 'status:"Planifié",planned_surface_m2:'),
            ('status:"Travaux en cours",actual_surface_m2:', 'status:"Travaux réalisés",actual_surface_m2:'),
            ('status:"Travaux effectués",actual_date:', 'status:"Travaux réalisés",actual_date:'),
            ('status:"Travaux en cours"', 'status:"Travaux réalisés"'),
            ('status:"Travaux effectués"', 'status:"Travaux réalisés"'),
            ('status:"Constat à vérifier"', 'status:"À vérifier"'),
            ('status: "À planifier"', 'status: "Nouveau OS"'),
            ('data.status || "À planifier"', 'data.status || "Nouveau OS"'),
            ('status:plannedDate?"Planifié":"À planifier"', 'status:plannedDate?"Planifié":"Nouveau OS"'),
            ('status: plannedDate?"Planifié":"À planifier"', 'status: plannedDate?"Planifié":"Nouveau OS"'),
            ('status:plannedDate ? "Planifié" : "À planifier"', 'status:plannedDate ? "Planifié" : "Nouveau OS"'),
            ('const nextStatus=plannedDate?"Planifié":"À planifier"', 'const nextStatus=plannedDate?"Planifié":"Nouveau OS"'),
            ('["À planifier","Planifié","Travaux en cours","Travaux réalisés"]', '["Nouveau OS","Planifié","Travaux réalisés"]'),
            ('["À planifier","Planifié"]', '["Nouveau OS","Planifié"]'),
            ('["Nouveau", "À planifier", "Planifié", "Travaux en cours", "En erreur"]', '["Nouveau OS", "Planifié", "En erreur"]'),
            ('os.status === "Travaux effectués"', 'os.status === "Validé"'),
            ('os.status === "Constat à vérifier"', 'os.status === "À vérifier"'),
            ('"Constat à vérifier"', '"À vérifier"'),
            ('"À planifier"', '"Nouveau OS"'),
            ('>À planifier<', '>Nouveaux OS<'),
            ('>Travaux en cours<', '>Travaux réalisés<'),
          ]
          for old, new in replacements:
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Build
        run: npm install && npm run build
      - name: Commit normalized status workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx src/statusColors.js
          git diff --cached --quiet && exit 0
          git commit -m "[auto] finalize simplified OS status workflow"
          git push origin setom-v2-stable
