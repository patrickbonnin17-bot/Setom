name: Stabilize SETOM v2

on:
  push:
    branches:
      - setom-v2-stable
    paths:
      - "scripts/patch_travaux_transmission.py"
      - ".github/workflows/stabilize-setom-v2.yml"

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply transmission patch
        run: python3 scripts/patch_travaux_transmission.py

      - name: Commit stabilized source
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx
          git commit -m "chore: apply SETOM transmission stability patch"
          git push
